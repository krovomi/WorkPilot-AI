# La section s'appelait `[tool:pytest]`, l'orthographe reservee a `setup.cfg`.
# Dans un `pytest.ini`, pytest ne lit que `[pytest]` : tout ce fichier etait donc
# inerte — filtres, motifs de decouverte, `addopts`, `testpaths` et marqueurs
# compris. Rien ne le signalait, puisqu'un fichier de config sans section connue
# se lit comme un fichier vide. Le renommer a immediatement fait sortir le
# `ignore::MovedIn20Warning` ci-dessous, qui n'avait jamais eu l'occasion
# d'echouer : c'est un avertissement SQLAlchemy, il lui faut son chemin complet.
[pytest]
# Ignore deprecation warnings from websockets and datetime.utcnow() usage
filterwarnings =
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:.*websockets.*
    ignore::UserWarning:.*websockets.*
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.MovedIn20Warning

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
# `--import-mode=importlib` : avec le mode `prepend` par defaut, deux fichiers
# de test qui partagent un nom de base (`tests/test_llm_provider.py` et
# `src/tests/test_llm_provider.py`) s'importent comme un seul module, et un
# meme module atteint sous deux chemins (`analysis.insight_extractor` vs
# `insight_extractor`) existe en deux exemplaires — un `monkeypatch` s'applique
# alors a la copie que le test ne regarde pas. Les deux arbres ne tournaient
# jamais ensemble, donc rien ne l'avait montre.
addopts = -v --tb=short --disable-warnings --import-mode=importlib

# La CI lance pytest depuis ce repertoire, donc c'est ce fichier — et non celui
# de la racine — qui la configure. Il posait `testpaths = streaming`, un reste
# d'une migration abandonnee : la CI passe toujours un chemin explicite, donc
# `testpaths` n'etait lu par personne.
testpaths =
    ../../tests
    .
    ../../src

# `tests/conftest.py` posait ce mode a l'execution, donc uniquement pour ce qui
# vit sous `tests/`. Tout `async def` collecte ailleurs echouait sur « async def
# functions are not natively supported ».
asyncio_mode = auto

# Markers
markers =
    asyncio: marks tests as async
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
