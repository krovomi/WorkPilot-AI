# The phone app is its own pnpm project, outside the desktop workspace (see the
# root pnpm-workspace.yaml). Metro and the React Native native builds expect a
# flat node_modules, hence the hoisted linker.
packages:
  - .

minimumReleaseAgeExclude:
  - i18next@26.6.0
  - react-i18next@17.1.10

nodeLinker: hoisted

# No dependency needs its install script: both ship prebuilt binaries
# through optional packages and only fall back to compiling.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

# GHSA-3g3m-2fjr-6pw4 (glob, fixed in 14.0.2 only) and GHSA-g3hv-75wg-m249
# (minimatch, fixed in 11.0.1 only), the same lift as the desktop workspace:
# Expo's config, CLI, fingerprint and Metro config, and Jest's config, runtime,
# reporters and test-exclude call only `glob()`, `globSync()`, `sync()`,
# `minimatch()` and `new Minimatch()`, which keep their shape on the fixed
# lines. deepmerge (GHSA-gcqx-w48m-w2h4, low, reached through jest-config only)
# has no fixed release yet.
overrides:
  'glob@>=9.0.0 <14.0.2': ^14.0.3
  'minimatch@>=7.0.0 <11.0.1': ^11.0.4
