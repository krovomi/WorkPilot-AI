# The one pytest configuration of the repository (audit lot L11, F31).
#
# There were three: this file, `apps/backend/pytest.ini` (the one CI read,
# because it ran pytest from `apps/backend`) and `apps/backend/pyproject.toml`,
# whose `testpaths = ["tests"]` named a directory that does not exist there.
# They disagreed on `testpaths`, the import mode, the warning filters and the
# markers, and which one applied depended on the directory pytest was started
# from. CI now runs from the repository root, and so does everyone else.
#
# History worth keeping: the section was once spelled `[tool:pytest]`, the
# setup.cfg spelling, which a `pytest.ini` ignores — the whole file was inert
# and nothing said so.
[pytest]
# Le backend en tete : la CI posait deja PYTHONPATH=apps/backend:<racine>, et
# les imports sont plats (`from phase_config import ...`). `.` et `./src` pour
# les connecteurs partages.
pythonpath =
    apps/backend
    .
    ./src

# Every test lives in tests/. `apps/backend` and `src` are not collected: what
# matches `test_*.py` there is production code (`agents/test_generator.py`,
# `analysis/test_discovery.py`…) whose `Test*` classes pytest would import and
# try to collect. The last real test there, `runners/github/test_context_gatherer.py`,
# moved to tests/runners/github/, and the repository-root conftest.py with it.
testpaths =
    tests

norecursedirs = venv .venv .git __pycache__ .pytest_cache node_modules

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# `--import-mode=importlib` : avec le mode `prepend` par defaut, deux fichiers
# de test qui partagent un nom de base s'importent comme un seul module, et un
# meme module atteint sous deux chemins (`analysis.insight_extractor` vs
# `insight_extractor`) existe en deux exemplaires — un `monkeypatch`
# s'applique alors a la copie que le test ne regarde pas.
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --import-mode=importlib

# Pose ici plutot que dans `tests/conftest.py`, qui ne le faisait que pour ce
# qui vit sous `tests/` : tout `async def` collecte ailleurs echouait sur
# « async def functions are not natively supported ».
asyncio_mode = auto

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    streaming: Streaming-specific tests
    performance: Performance tests
    asyncio: marks tests as async

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::sqlalchemy.exc.MovedIn20Warning
