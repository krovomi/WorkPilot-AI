# La section s'appelait `[tool:pytest]`, l'orthographe reservee a `setup.cfg` ;
# dans un `pytest.ini`, pytest ne lit que `[pytest]`. Tout ce fichier etait donc
# inerte, `testpaths` compris — la ligne commentee ci-dessous decrivait une
# exclusion qui n'avait meme pas lieu.
[pytest]
testpaths =
    tests
    apps/backend
    src
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# `tests/conftest.py` posait ce mode a l'execution, donc uniquement pour ce qui
# vit sous `tests/`. Tout `async def` collecte ailleurs echouait sur « async def
# functions are not natively supported » — c'est une des « import issues » que la
# ligne commentee ci-dessus invoquait. Ici, le reglage vaut pour tout le depot.
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
pythonpath = 
    .
    ./src
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    streaming: Streaming-specific tests
    performance: Performance tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
