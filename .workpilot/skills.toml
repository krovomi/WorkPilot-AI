# Which skills this repository itself gets, and from where.
#
# `skills-cli` reads this to resolve `skills/` into `.agents/skills/` and the
# harness mirrors. Run `pnpm run skills:build` after editing, and commit the
# result -- CI runs `pnpm run skills:check` and fails on drift.
#
#   pnpm run skills:list      what resolves here, and why the rest does not

[targets]
# Toolchain versions this repo is on.
node = "20.0.0"
python = "3.13"
# Ajout des versions cibles requises par les compétences dotnet et mobiles :
dotnet = "10.0"
android = "8.0"
ios = "16.0"

[packs]
# Utilisation de "latest" ou des bonnes plages de versions pour éviter le rejet SemVer
comms = "^1"
tooling = "^1"
bmad = "^6"           # Mis à jour à ^6 pour accepter la version 6.12.0 détectée
dotnet = "latest"
mobile = "latest"
superpowers = "latest"
mattpocock = "latest"
impeccable = "latest"
task-observer = "latest"
claude-mem = "latest"
hermes = "latest"     # Ajouté car requis par claude-code, computer-use, etc.
hermes-learned = "latest"

# Add one and run `pnpm run skills:build` to pull it into this repo's palette.

# Harnesses to materialise. Omit to use the defaults from
# capabilities/harnesses.yaml (agnostic + gemini).
# harnesses = ["agnostic", "gemini", "copilot"]
