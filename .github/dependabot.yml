version: 2

# Grouping: minor and patch updates of one ecosystem arrive as a single pull
# request, so a quiet week is one PR to review instead of five. Major updates
# match no group and keep their own pull request each: they are the ones that
# break, and one breaking bump hidden in a batch would block the rest.
# Dependabot puts a dependency in the FIRST group whose rules it matches, so a
# group that must win (react, below) is listed before the catch-all.
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # npm dependencies.
  # Root, not /apps/frontend: this is a pnpm workspace, and pnpm-lock.yaml +
  # pnpm-workspace.yaml (which carries the security `overrides`) both live at the
  # top level. Pointed at apps/frontend, the updater saw a package.json with no
  # lockfile beside it and could not open a fix PR — both esbuild and @babel/core
  # were reported against `pnpm-lock.yaml` and neither got one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    # react and react-dom are one package in two tarballs: react-dom asserts at
    # runtime that both carry the *exact* same version and throws
    # "Incompatible React versions" otherwise. Ungrouped, the updater bumped
    # react-dom to 19.3.0 and left react at 19.2.4, and every one of the ~290
    # renderer test files failed to load — on a pull request that looked like a
    # routine patch bump. The types travel with them: @types/react-dom declares
    # a dependency on @types/react, so a lone bump pins the pair to a stale
    # resolution of the other.
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # After react on purpose: those four must stay together whatever the
      # update type, and the first matching group wins.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Biome is pinned by the rules (docs/rules/workflow.md), not by the
    # registry: a routine group bump took it to 2.5.15 while CI and the rules
    # said 2.5.11. Moving it is a decision — rules, package.json and the
    # formatted tree change together, by hand.
    ignore:
      - dependency-name: "@biomejs/biome"

  # The server image's base (deploy/Dockerfile.server), pinned by digest.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions. Every external action is pinned by commit SHA with its
  # version in a comment (tests/test_action_pins.py); Dependabot bumps both.
  # `directory: /` alone only reads .github/workflows: the composite actions
  # under .github/actions/ are listed too, or their pins would never move.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
