version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  # npm dependencies.
  # Root, not /apps/frontend: this is a pnpm workspace, and pnpm-lock.yaml +
  # pnpm-workspace.yaml (which carries the security `overrides`) both live at the
  # top level. Pointed at apps/frontend, the updater saw a package.json with no
  # lockfile beside it and could not open a fix PR — both esbuild and @babel/core
  # were reported against `pnpm-lock.yaml` and neither got one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    # react and react-dom are one package in two tarballs: react-dom asserts at
    # runtime that both carry the *exact* same version and throws
    # "Incompatible React versions" otherwise. Ungrouped, the updater bumped
    # react-dom to 19.3.0 and left react at 19.2.4, and every one of the ~290
    # renderer test files failed to load — on a pull request that looked like a
    # routine patch bump. The types travel with them: @types/react-dom declares
    # a dependency on @types/react, so a lone bump pins the pair to a stale
    # resolution of the other.
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
