name: Quality Security

# CodeQL runs on all PRs, pushes to main, and weekly schedule
# Note: CodeQL takes 20-30 min per language (40-60 min total)
# Bandit is fast (5-10 min)

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/backend/requirements.txt'
      - '.github/workflows/quality-security.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/backend/requirements.txt'
      - '.github/workflows/quality-security.yml'
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday at midnight UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          # The same exclusion `codeql.yml` uses. Two workflows run CodeQL on
          # every PR, each with its own `init`, so a scope set on one of them
          # is not set at all — which is how the vendored tree kept raising
          # alerts after being excluded. The config file is shared so the two
          # cannot drift into scanning different things.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # Bandit runs on all PRs - it's fast (5-10 min)
  python-security:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        id: bandit
        run: |
          echo "::group::Running Bandit security scan"
          bandit -r apps/backend/ -ll -ii -f json -o bandit-report.json || BANDIT_EXIT=$?
          if [ "${BANDIT_EXIT:-0}" -gt 1 ]; then
            echo "::error::Bandit scan failed with exit code $BANDIT_EXIT"
            exit 1
          fi
          echo "::endgroup::"

      - name: Analyze Bandit results
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('bandit-report.json')) {
              core.setFailed('Bandit report not found - scan may have failed');
              return;
            }

            const report = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            const results = report.results || [];

            const high = results.filter(r => r.issue_severity === 'HIGH');
            const medium = results.filter(r => r.issue_severity === 'MEDIUM');
            const low = results.filter(r => r.issue_severity === 'LOW');

            console.log(`::group::Bandit Security Scan Results`);
            console.log(`Found ${results.length} issues:`);
            console.log(`  HIGH:   ${high.length}`);
            console.log(`  MEDIUM: ${medium.length}`);
            console.log(`  LOW:    ${low.length}`);
            console.log('::endgroup::');

            let summary = `## Python Security Scan (Bandit)\n\n`;
            summary += `| Severity | Count |\n`;
            summary += `|----------|-------|\n`;
            summary += `| High | ${high.length} |\n`;
            summary += `| Medium | ${medium.length} |\n`;
            summary += `| Low | ${low.length} |\n\n`;

            if (high.length > 0) {
              summary += `### High Severity Issues\n\n`;
              for (const issue of high) {
                summary += `- **${issue.filename}:${issue.line_number}**\n`;
                summary += `  - ${issue.issue_text}\n`;
                summary += `  - Test: \`${issue.test_id}\` (${issue.test_name})\n\n`;
              }
            }

            core.summary.addRaw(summary);
            await core.summary.write();

            if (high.length > 0) {
              core.setFailed(`Found ${high.length} high severity security issue(s)`);
            } else {
              console.log('No high severity security issues found');
            }

  # --------------------------------------------------------------------------
  # Known-vulnerable dependencies.
  #
  # CodeQL reads the code we wrote and Bandit reads its Python; neither looks
  # at what the lockfiles pull in. Dependabot does, but Dependabot opens pull
  # requests — it does not stop one. So a PR could add a dependency with a
  # published advisory and nothing in CI would say so.
  #
  # The two ecosystems get different gates on purpose, because they are in
  # different states and one rule would have to be the weaker of the two:
  #
  #   pip-audit   fails on any finding. apps/backend/requirements.txt is clean
  #               today, so the gate is green and every future failure is a
  #               real regression.
  #   pnpm audit  fails on `critical` only (0 today), and reports high and
  #               moderate. There are 9 high findings already, all transitive
  #               under electron-builder / electron-updater packaging tooling
  #               with no direct fix path. A gate that is red the day it lands
  #               is a gate somebody deletes in a week; one that is green and
  #               prints the backlog is one that survives to catch the next
  #               one.
  #
  # Raise the pnpm threshold to `high` once that backlog is cleared — that is
  # the change this comment exists to make obvious.
  # --------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r apps/backend/requirements.txt \
            --progress-spinner off \
            --desc \
            --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # No `pnpm install`: `pnpm audit` answers from pnpm-lock.yaml alone.
      # Installing would add minutes and a second way for this job to fail
      # (a frozen-lockfile mismatch) without changing the answer.
      - name: Audit npm dependencies
        run: pnpm audit --json > pnpm-audit.json || true

      - name: Report npm findings
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            let report;
            try {
              report = JSON.parse(fs.readFileSync('pnpm-audit.json', 'utf8'));
            } catch (error) {
              core.setFailed(`Could not read pnpm audit output: ${error.message}`);
              return;
            }

            const counts = report.metadata?.vulnerabilities ?? {};
            const advisories = Object.values(report.advisories ?? {});

            let summary = `## npm Dependency Audit\n\n`;
            summary += `| Severity | Count |\n|----------|-------|\n`;
            for (const level of ['critical', 'high', 'moderate', 'low']) {
              summary += `| ${level} | ${counts[level] ?? 0} |\n`;
            }

            const blocking = advisories.filter(a => a.severity === 'critical');
            if (blocking.length > 0) {
              summary += `\n### Critical\n\n`;
              for (const advisory of blocking) {
                const path = advisory.findings?.[0]?.paths?.[0] ?? 'unknown path';
                summary += `- **${advisory.module_name}** — ${advisory.title}\n`;
                summary += `  - via \`${path}\`\n`;
              }
            }

            core.summary.addRaw(summary);
            await core.summary.write();

            if (blocking.length > 0) {
              core.setFailed(`${blocking.length} critical advisory/advisories in npm dependencies`);
            }

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, python-security, dependency-audit]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check security results
        uses: actions/github-script@v9
        with:
          script: |
            const codeql = '${{ needs.codeql.result }}';
            const bandit = '${{ needs.python-security.result }}';
            const deps = '${{ needs.dependency-audit.result }}';

            console.log('Security Check Results:');
            console.log(`  CodeQL:        ${codeql}`);
            console.log(`  Bandit:        ${bandit}`);
            console.log(`  Dependencies:  ${deps}`);

            // Only 'failure' is a real failure; 'skipped' is acceptable (e.g., path filters, PR skipping CodeQL)
            const acceptable = ['success', 'skipped'];
            const codeqlOk = acceptable.includes(codeql);
            const banditOk = acceptable.includes(bandit);
            const depsOk = acceptable.includes(deps);
            const allPassed = codeqlOk && banditOk && depsOk;

            if (allPassed) {
              console.log('\n✅ All security checks passed');
              core.summary.addRaw('## ✅ Security Checks Passed\n\nAll security scans completed successfully.');
            } else {
              console.log('\n❌ Some security checks failed');
              core.summary.addRaw('## ❌ Security Checks Failed\n\nOne or more security scans found issues.');
              core.setFailed('Security checks failed');
            }

            await core.summary.write();
