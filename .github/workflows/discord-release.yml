name: Discord Release Notification

# release.yml dispatches this after it publishes: its release is published
# with GITHUB_TOKEN, and events raised by that token start no other workflow,
# so `release: published` only fires for a release a person publishes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g., v1.2.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      # Without the webhook secret the action fails on an empty URL and the
      # run turns red after every release. Nothing to announce to: say so and
      # stop green. Set DISCORD_WEBHOOK_URL in the repository secrets to
      # announce releases on Discord.
      - name: Check the webhook
        id: webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::notice title=Discord::DISCORD_WEBHOOK_URL is not set: release not announced."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the release
        id: release
        if: steps.webhook.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          {
            echo "name=$(jq -r .name release.json)"
            echo "url=$(jq -r .url release.json)"
            echo 'body<<RELEASE_BODY_EOF'
            jq -r .body release.json
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send to Discord
        if: steps.webhook.outputs.configured == 'true'
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          release_name: ${{ steps.release.outputs.name }}
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
          color: "5793266"
          username: "WorkPilot AI Releases"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          footer_title: "WorkPilot AI Changelog"
          footer_timestamp: true
          reduce_headings: true
          remove_github_reference_links: true
