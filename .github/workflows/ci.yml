# Cross-Platform CI Pipeline
#
# Tests on all target platforms (Linux, Windows, macOS) to catch
# platform-specific bugs before they merge. ALL platforms must pass.
#
# Optimized: Reduced matrix (4 jobs vs 6), merged integration tests,
# coverage on Linux only; only files nothing reads skip it (paths-ignore).

name: CI

on:
  push:
    branches: [main, develop]
    # Not a whitelist: a whitelist forgets whatever a test starts reading
    # (pnpm-lock.yaml, pytest.ini, workflows/, capabilities/, config/,
    # skills/ were all read by tests and all missing). Only files nothing
    # builds, lints or reads are skipped; tests/test_ci_triggers.py holds
    # this list to that.
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main, develop]
    # Same list as push.
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # --------------------------------------------------------------------------
  # Python Backend Tests - 3.13 on all platforms, 3.12 on Linux
  # --------------------------------------------------------------------------
  test-python:
    name: test-python (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 3.13 on all OS for latest version coverage, and 3.12 (the floor:
        # the bundled runtime, the server image, ruff's target-version) on
        # Linux, so code that needs 3.13 cannot merge unnoticed.
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ matrix.python-version }}
          install-test-deps: 'true'

      # The OS sandbox's real tests (tests/os_sandbox/test_real_sandbox.py)
      # run a command under bubblewrap. Ubuntu 24.04 confines unprivileged
      # user namespaces with AppArmor; a person's machine set up for the
      # sandbox lifts that (docs/architecture/os-sandbox.md), and so does
      # this runner. On macOS, Seatbelt is part of the system.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run all tests (including platform-specific)
        shell: bash
        env:
          # Fails the sandbox tests instead of skipping them where the
          # runner is meant to have a sandbox.
          WORKPILOT_EXPECT_SANDBOX: ${{ runner.os != 'Windows' && '1' || '' }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source apps/backend/.venv/Scripts/activate
          else
            source apps/backend/.venv/bin/activate
          fi
          # Depuis la racine, sans argument : pytest suit `testpaths` du
          # pytest.ini racine, la seule configuration du depot (lot L11, F31),
          # et son `pythonpath` remplace le PYTHONPATH que ce pas posait.
          #
          # Chaque test en echec devient une annotation du job (`::error`) :
          # le resume court de pytest est la seule ligne qui nomme le test,
          # et un journal brut de 12 000 lignes n'est pas toujours lisible
          # depuis l'API (le stockage des journaux n'est pas joignable de
          # partout). Le code de sortie de pytest reste celui du pas.
          log="$(mktemp)"
          status=0
          pytest -v --tb=short -x -rfE 2>&1 | tee "$log" || status=$?
          grep -E '^(FAILED|ERROR) ' "$log" | sed 's/^/::error title=pytest::/' || true
          exit "$status"

      - name: Run coverage (Linux + Python 3.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          source apps/backend/.venv/bin/activate
          # A floor, not a goal: about two points under the 60 % the suite
          # covered on 29 October 2026. Raise it when the suite grows.
          pytest -v --cov=apps/backend --cov-report=xml:apps/backend/coverage.xml --cov-report=term-missing --cov-fail-under=58

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./apps/backend/coverage.xml
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # Frontend Tests - All Platforms
  # --------------------------------------------------------------------------
  test-frontend:
    name: test-frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run TypeScript type check
        working-directory: apps/frontend
        run: pnpm run typecheck

      # Coverage, and its floor in vitest.config.ts, on Linux only: the
      # numbers do not depend on the OS, the instrumentation costs time.
      - name: Run unit tests
        working-directory: apps/frontend
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            pnpm run test:coverage --coverage.reporter=text-summary
          else
            pnpm run test
          fi

      - name: Build application
        working-directory: apps/frontend
        run: pnpm run build

      # The 1.3.1 main process threw while loading (F114) and every check
      # was green: nothing ever started the app. Start the build once and
      # require the renderer to mount (apps/frontend/src/main/smoke-test.ts).
      # Dependencies are installed with --ignore-scripts, so the Electron
      # binary is fetched here.
      - name: Fetch the Electron binary
        working-directory: apps/frontend
        run: node node_modules/electron/install.js

      - name: Start the app once (smoke test)
        working-directory: apps/frontend
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a node scripts/smoke-test.cjs
          else
            node scripts/smoke-test.cjs
          fi

  # --------------------------------------------------------------------------
  # E2E - the built app, driven by Playwright like a new user would
  # --------------------------------------------------------------------------
  # The specs in apps/frontend/e2e/ used to write files and read them back
  # without starting the app, and the ones that did start it skipped
  # themselves when it failed. These start the real build under xvfb with a
  # fresh home and profile (e2e/app-harness.ts); a launch failure fails.
  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Fetch the Electron binary
        working-directory: apps/frontend
        run: node node_modules/electron/install.js

      - name: Build application
        working-directory: apps/frontend
        run: pnpm run build

      - name: Run the E2E specs
        working-directory: apps/frontend
        env:
          CI: 'true'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm run test:e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Server image - build it, migrate a real database with it, serve /health
  # --------------------------------------------------------------------------
  # The image had shipped a COPY of a file that did not exist and a first
  # migration that failed on a fresh database, and nothing built it. This job
  # does what `docker compose up` does, against the same Postgres major.
  server-image:
    name: server-image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workpilot
          POSTGRES_USER: workpilot
          POSTGRES_PASSWORD: workpilot-ci  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the server image
        run: docker build -f deploy/Dockerfile.server -t workpilot-server:ci .

      - name: Migrate, start, and answer /health
        shell: bash
        run: |
          set -euo pipefail
          # Throwaway values for a throwaway database, made here and gone with
          # the runner: the server refuses to start in server mode without them.
          jwt="$(openssl rand -hex 32)"
          master="$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          docker run -d --name server --network host \
            -e WORKPILOT_SERVER_MODE=true \
            -e WORKPILOT_DATABASE_URL=postgresql+asyncpg://workpilot:workpilot-ci@127.0.0.1:5432/workpilot \
            -e WORKPILOT_JWT_SECRET="$jwt" \
            -e WORKPILOT_SECRETS_MASTER_KEY="$master" \
            -e WORKPILOT_REPOS_ROOT=/data/repos \
            workpilot-server:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health; then
              echo
              docker exec server alembic -c server/db/alembic.ini current | grep '(head)'
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' server)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs server
          exit 1

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend, e2e, server-image]
    if: always()
    steps:
      - name: Check all CI jobs passed
        run: |
          echo "CI Job Results:"
          echo "  test-python:   ${{ needs.test-python.result }}"
          echo "  test-frontend: ${{ needs.test-frontend.result }}"
          echo "  e2e:           ${{ needs.e2e.result }}"
          echo "  server-image:  ${{ needs.server-image.result }}"
          echo ""

          if [[ "${{ needs.test-python.result }}" != "success" ]] || \
             [[ "${{ needs.test-frontend.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]] || \
             [[ "${{ needs.server-image.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
