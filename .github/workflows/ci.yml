# Cross-Platform CI Pipeline
#
# Tests on all target platforms (Linux, Windows, macOS) to catch
# platform-specific bugs before they merge. ALL platforms must pass.
#
# Optimized: Reduced matrix (4 jobs vs 6), merged integration tests,
# coverage on Linux only, path filters to skip on docs-only changes.

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'tests/**'
      - 'src/**'
      - 'package*.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tsconfig*.json'
      - 'biome.jsonc'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'tests/**'
      - 'src/**'
      - 'package*.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tsconfig*.json'
      - 'biome.jsonc'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # --------------------------------------------------------------------------
  # Python Backend Tests - Python 3.13 version on all platforms
  # --------------------------------------------------------------------------
  test-python:
    name: test-python (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 3.13 on all OS for latest version coverage
        include:
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: ${{ matrix.python-version }}
          install-test-deps: 'true'

      - name: Run all tests (including platform-specific)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source apps/backend/.venv/Scripts/activate
          else
            source apps/backend/.venv/bin/activate
          fi
          # Depuis la racine, sans argument : pytest suit `testpaths` du
          # pytest.ini racine, la seule configuration du depot (lot L11, F31),
          # et son `pythonpath` remplace le PYTHONPATH que ce pas posait.
          #
          # Chaque test en echec devient une annotation du job (`::error`) :
          # le resume court de pytest est la seule ligne qui nomme le test,
          # et un journal brut de 12 000 lignes n'est pas toujours lisible
          # depuis l'API (le stockage des journaux n'est pas joignable de
          # partout). Le code de sortie de pytest reste celui du pas.
          log="$(mktemp)"
          status=0
          pytest -v --tb=short -x -rfE 2>&1 | tee "$log" || status=$?
          grep -E '^(FAILED|ERROR) ' "$log" | sed 's/^/::error title=pytest::/' || true
          exit "$status"

      - name: Run coverage (Linux + Python 3.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          source apps/backend/.venv/bin/activate
          pytest -v --cov=apps/backend --cov-report=xml:apps/backend/coverage.xml --cov-report=term-missing --cov-fail-under=10

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./apps/backend/coverage.xml
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # Frontend Tests - All Platforms
  # --------------------------------------------------------------------------
  test-frontend:
    name: test-frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run TypeScript type check
        working-directory: apps/frontend
        run: pnpm run typecheck

      - name: Run unit tests
        working-directory: apps/frontend
        run: pnpm run test

      - name: Build application
        working-directory: apps/frontend
        run: pnpm run build

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    if: always()
    steps:
      - name: Check all CI jobs passed
        run: |
          echo "CI Job Results:"
          echo "  test-python:   ${{ needs.test-python.result }}"
          echo "  test-frontend: ${{ needs.test-frontend.result }}"
          echo ""

          if [[ "${{ needs.test-python.result }}" != "success" ]] || \
             [[ "${{ needs.test-frontend.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
