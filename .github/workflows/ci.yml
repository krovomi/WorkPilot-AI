# Cross-Platform CI Pipeline
#
# Tests on all target platforms (Linux, Windows, macOS) to catch
# platform-specific bugs before they merge. ALL platforms must pass.
#
# Python 3.12 (the shipped runtime) in shards on each OS for pull requests,
# 3.13 once a change lands; coverage on Linux only; only files nothing reads
# skip it (paths-ignore).

name: CI

on:
  push:
    branches: [main, develop]
    # Not a whitelist: a whitelist forgets whatever a test starts reading
    # (pnpm-lock.yaml, pytest.ini, workflows/, capabilities/, config/,
    # skills/ were all read by tests and all missing). Only files nothing
    # builds, lints or reads are skipped; tests/test_ci_triggers.py holds
    # this list to that.
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main, develop]
    # Same list as push.
    paths-ignore:
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # --------------------------------------------------------------------------
  # Python Backend Tests - 3.12 on all platforms, split into shards
  # --------------------------------------------------------------------------
  # 3.12 is what users run: the bundled runtime (download-python.cjs), the
  # server image and ruff's target-version. A pull request used to also wait
  # for a 3.13 copy of the Linux run (twice: once plain, once for coverage)
  # and for 3.13 on Windows and macOS; 3.13 now runs once a change lands on
  # develop or main (test-python-latest), where it still catches a 3.13-only
  # break without holding up every pull request.
  #
  # Each OS runs the suite in shards side by side (tests/ci_shard.py): the
  # Windows run alone took 23 minutes. Linux measures coverage per shard and
  # the coverage job adds the shards up and holds the floor.
  test-python:
    name: test-python (3.12, ${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1/2 }
          - { os: ubuntu-latest, shard: 2/2 }
          - { os: windows-latest, shard: 1/4 }
          - { os: windows-latest, shard: 2/4 }
          - { os: windows-latest, shard: 3/4 }
          - { os: windows-latest, shard: 4/4 }
          - { os: macos-latest, shard: 1/2 }
          - { os: macos-latest, shard: 2/2 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: '3.12'
          install-test-deps: 'true'

      # The OS sandbox's real tests (tests/os_sandbox/test_real_sandbox.py)
      # run a command under bubblewrap. Ubuntu 24.04 confines unprivileged
      # user namespaces with AppArmor; a person's machine set up for the
      # sandbox lifts that (docs/architecture/os-sandbox.md), and so does
      # this runner. On macOS, Seatbelt is part of the system.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run all tests (including platform-specific)
        shell: bash
        env:
          # Fails the sandbox tests instead of skipping them where the
          # runner is meant to have a sandbox.
          WORKPILOT_EXPECT_SANDBOX: ${{ runner.os != 'Windows' && '1' || '' }}
          WORKPILOT_TEST_SHARD: ${{ matrix.shard }}
          # sys.monitoring (Python 3.12+) instead of a trace function: the
          # Linux run with coverage took 10 minutes, 6 without.
          COVERAGE_CORE: sysmon
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source apps/backend/.venv/Scripts/activate
          else
            source apps/backend/.venv/bin/activate
          fi
          # Coverage on Linux only: the numbers do not depend on the OS. One
          # run measures it, the coverage job adds the shards up.
          cov=()
          if [ "$RUNNER_OS" == "Linux" ]; then
            cov=(--cov=apps/backend --cov-report=)
          fi
          # Depuis la racine, sans argument : pytest suit `testpaths` du
          # pytest.ini racine, la seule configuration du depot (lot L11, F31),
          # et son `pythonpath` remplace le PYTHONPATH que ce pas posait.
          #
          # Chaque test en echec devient une annotation du job (`::error`) :
          # le resume court de pytest est la seule ligne qui nomme le test,
          # et un journal brut de 12 000 lignes n'est pas toujours lisible
          # depuis l'API (le stockage des journaux n'est pas joignable de
          # partout). Le code de sortie de pytest reste celui du pas.
          log="$(mktemp)"
          status=0
          pytest -v --tb=short -x -rfE "${cov[@]}" 2>&1 | tee "$log" || status=$?
          grep -E '^(FAILED|ERROR) ' "$log" | sed 's/^/::error title=pytest::/' || true
          exit "$status"

      - name: Keep this shard's coverage data
        if: runner.os == 'Linux'
        shell: bash
        run: mv .coverage ".coverage.shard${{ strategy.job-index }}"

      - name: Upload this shard's coverage data
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: .coverage.shard*
          include-hidden-files: true
          retention-days: 1

  # --------------------------------------------------------------------------
  # Python coverage - the Linux shards added up, against the floor
  # --------------------------------------------------------------------------
  coverage-python:
    name: coverage-python
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download the shards' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and hold the floor
        run: |
          python -m pip install --quiet 'coverage>=7.4'
          python -m coverage combine .coverage.shard*
          # A floor, not a goal: about two points under the 60 % the suite
          # covered on 29 October 2026. Raise it when the suite grows.
          python -m coverage report --fail-under=58 | tail -n 3
          python -m coverage xml -o apps/backend/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./apps/backend/coverage.xml
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # Python Backend Tests - the newest Python, once a change has landed
  # --------------------------------------------------------------------------
  # Users may point the app at a system Python newer than the bundled 3.12
  # (python-detector.ts accepts up to 3.14). Not worth holding every pull
  # request for: it runs on develop and main.
  test-python-latest:
    name: test-python (3.13, ubuntu-latest)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: '3.13'
          install-test-deps: 'true'

      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run all tests
        env:
          WORKPILOT_EXPECT_SANDBOX: '1'
        run: |
          source apps/backend/.venv/bin/activate
          log="$(mktemp)"
          status=0
          pytest -v --tb=short -x -rfE 2>&1 | tee "$log" || status=$?
          grep -E '^(FAILED|ERROR) ' "$log" | sed 's/^/::error title=pytest::/' || true
          exit "$status"

  # --------------------------------------------------------------------------
  # Frontend Tests - All Platforms
  # --------------------------------------------------------------------------
  test-frontend:
    name: test-frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Run TypeScript type check
        working-directory: apps/frontend
        run: pnpm run typecheck

      # Coverage, and its floor in vitest.config.ts, on Linux only: the
      # numbers do not depend on the OS, the instrumentation costs time.
      - name: Run unit tests
        working-directory: apps/frontend
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            pnpm run test:coverage --coverage.reporter=text-summary
          else
            pnpm run test
          fi

      - name: Build application
        working-directory: apps/frontend
        run: pnpm run build

      # The 1.3.1 main process threw while loading (F114) and every check
      # was green: nothing ever started the app. Start the build once and
      # require the renderer to mount (apps/frontend/src/main/smoke-test.ts).
      # Dependencies are installed with --ignore-scripts, so the Electron
      # binary is fetched here.
      - name: Fetch the Electron binary
        working-directory: apps/frontend
        run: node node_modules/electron/install.js

      - name: Start the app once (smoke test)
        working-directory: apps/frontend
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a node scripts/smoke-test.cjs
          else
            node scripts/smoke-test.cjs
          fi

  # --------------------------------------------------------------------------
  # E2E - the built app, driven by Playwright like a new user would
  # --------------------------------------------------------------------------
  # The specs in apps/frontend/e2e/ used to write files and read them back
  # without starting the app, and the ones that did start it skipped
  # themselves when it failed. These start the real build under xvfb with a
  # fresh home and profile (e2e/app-harness.ts); a launch failure fails.
  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Fetch the Electron binary
        working-directory: apps/frontend
        run: node node_modules/electron/install.js

      - name: Build application
        working-directory: apps/frontend
        run: pnpm run build

      - name: Run the E2E specs
        working-directory: apps/frontend
        env:
          CI: 'true'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm run test:e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Server image - build it, migrate a real database with it, serve /health
  # --------------------------------------------------------------------------
  # The image had shipped a COPY of a file that did not exist and a first
  # migration that failed on a fresh database, and nothing built it. This job
  # does what `docker compose up` does, against the same Postgres major.
  server-image:
    name: server-image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workpilot
          POSTGRES_USER: workpilot
          POSTGRES_PASSWORD: workpilot-ci  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the server image
        run: docker build -f deploy/Dockerfile.server -t workpilot-server:ci .

      - name: Migrate, start, and answer /health
        shell: bash
        run: |
          set -euo pipefail
          # Throwaway values for a throwaway database, made here and gone with
          # the runner: the server refuses to start in server mode without them.
          jwt="$(openssl rand -hex 32)"
          master="$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          docker run -d --name server --network host \
            -e WORKPILOT_SERVER_MODE=true \
            -e WORKPILOT_DATABASE_URL=postgresql+asyncpg://workpilot:workpilot-ci@127.0.0.1:5432/workpilot \
            -e WORKPILOT_JWT_SECRET="$jwt" \
            -e WORKPILOT_SECRETS_MASTER_KEY="$master" \
            -e WORKPILOT_REPOS_ROOT=/data/repos \
            workpilot-server:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health; then
              echo
              docker exec server alembic -c server/db/alembic.ini current | grep '(head)'
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' server)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs server
          exit 1

  # --------------------------------------------------------------------------
  # Server e2e - two organizations on one real server
  # --------------------------------------------------------------------------
  # The server-mode tests call the routes one at a time. This starts the server
  # as deploy/ does (migrations, streaming server, provider_api under uvicorn)
  # against Postgres 16, makes two organizations through the API, and proves
  # that each works and neither reaches the other: cards, runs (a fake agent,
  # confined by Landlock), jobs, the live stream, every route that names a
  # project. tests/backend/test_server_two_orgs_e2e.py; it fails here, never
  # skips (WORKPILOT_EXPECT_SERVER_E2E).
  server-e2e:
    name: server-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workpilot
          POSTGRES_USER: workpilot
          POSTGRES_PASSWORD: workpilot-ci  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: '3.12'
          install-test-deps: 'true'

      - name: Two organizations, one server
        env:
          WORKPILOT_E2E_DATABASE_URL: postgresql+asyncpg://workpilot:workpilot-ci@127.0.0.1:5432/workpilot  # pragma: allowlist secret
          WORKPILOT_EXPECT_SERVER_E2E: '1'
        run: |
          source apps/backend/.venv/bin/activate
          pytest tests/backend/test_server_two_orgs_e2e.py -v --tb=short -rfE

  # --------------------------------------------------------------------------
  # The desktop app against a real server - two copies of the built app,
  # signed in as two members of one organization, and a third person of
  # another organization (apps/frontend/e2e/server-mode.server-e2e.ts)
  # --------------------------------------------------------------------------
  app-server-e2e:
    name: app-server-e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python backend
        uses: ./.github/actions/setup-python-backend
        with:
          python-version: '3.12'
          install-test-deps: 'true'

      - name: Setup Node.js frontend
        uses: ./.github/actions/setup-node-frontend
        with:
          ignore-scripts: 'true'

      - name: Fetch the Electron binary
        working-directory: apps/frontend
        run: node node_modules/electron/install.js

      - name: Build application
        working-directory: apps/frontend
        run: pnpm run build

      - name: The app against the server
        working-directory: apps/frontend
        env:
          CI: 'true'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm run test:e2e:server

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-server-e2e-results
          path: |
            apps/frontend/test-results/
            apps/frontend/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test-python, coverage-python, test-frontend, e2e, server-image, server-e2e, app-server-e2e]
    if: always()
    steps:
      - name: Check all CI jobs passed
        run: |
          echo "CI Job Results:"
          echo "  test-python:   ${{ needs.test-python.result }}"
          echo "  coverage-python: ${{ needs.coverage-python.result }}"
          echo "  test-frontend: ${{ needs.test-frontend.result }}"
          echo "  e2e:           ${{ needs.e2e.result }}"
          echo "  server-image:  ${{ needs.server-image.result }}"
          echo "  server-e2e:    ${{ needs.server-e2e.result }}"
          echo "  app-server-e2e: ${{ needs.app-server-e2e.result }}"
          echo ""

          if [[ "${{ needs.test-python.result }}" != "success" ]] || \
             [[ "${{ needs.coverage-python.result }}" != "success" ]] || \
             [[ "${{ needs.test-frontend.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]] || \
             [[ "${{ needs.server-image.result }}" != "success" ]] || \
             [[ "${{ needs.server-e2e.result }}" != "success" ]] || \
             [[ "${{ needs.app-server-e2e.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
