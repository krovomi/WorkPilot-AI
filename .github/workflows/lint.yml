name: Lint

on:
  push:
    branches: [main, develop]
    # Not a whitelist: a whitelist forgets whatever a test starts reading
    # (pnpm-lock.yaml, pytest.ini, workflows/, capabilities/, config/,
    # skills/ were all read by tests and all missing). Only files nothing
    # builds, lints or reads are skipped; tests/test_ci_triggers.py holds
    # this list to that.
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main, develop]
    # Same list as push.
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Python linting (Ruff) - already fast, no changes needed
  python:
    name: Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      # Keep in sync with the dev venv (pre-commit hook runs `python -m ruff`
      # from it) — version drift here means "passes locally, fails in CI".
      - name: Install ruff
        run: pip install ruff==0.15.7

      # `tests/` and `src/` (and `utils/`, removed in audit lot L9) were outside
      # the gate until then, which is why they had drifted to 11 lint errors
      # and 169 unformatted files while apps/backend/ stayed clean: nothing
      # was checking them. `tests/` is the
      # second-largest body of Python here and the one every contributor
      # touches, so leaving it ungated meant the suite that guards the product
      # was the least guarded thing in the repo.
      # `scripts/` joined the gate in audit lot M2: it builds the skills
      # output, vendors third-party trees and runs on contributors' machines
      # as git hooks, so it gets the same guarantee as the code it serves.
      - name: Run ruff check
        run: ruff check apps/backend/ tests/ src/ scripts/ --output-format=github

      - name: Run ruff format check
        run: ruff format apps/backend/ tests/ src/ scripts/ --check --diff

      # `requirements.txt` holds the ranges, `requirements.lock` the exact
      # versions (with hashes) that CI and the server image install. This
      # regenerates the lock beside a copy of both and fails on any
      # difference: a range edited without `uv pip compile` re-run, or a lock
      # edited by hand. uv keeps the pins already in the lock when they still
      # satisfy the ranges, so an unchanged requirements.txt gives the same
      # bytes. Needs PyPI.
      - name: Install uv
        run: pip install uv==0.11.32

      - name: Check the Python lockfile matches requirements.txt
        run: |
          tmp="$(mktemp -d)"
          cp apps/backend/requirements.txt apps/backend/requirements.lock "$tmp/"
          (cd "$tmp" && uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes -o requirements.lock --quiet)
          diff -u apps/backend/requirements.lock "$tmp/requirements.lock"

      # `apps/backend/vendor/archify` is a pinned copy of third-party code, and
      # a pin nobody verifies is a comment. This compares the bytes on disk to
      # the digest `VENDOR.json` records, and fails naming the files that moved.
      #
      # It exists because three files in that tree were once edited in place by
      # an autofix bot: the receipt still said v2.16.0, because the only thing
      # anyone checked was that string. Re-running the vendoring script then
      # reverted the edits without saying so. Reads the disk, hits no network.
      - name: Check the vendored archify tree matches its pin
        run: python3 scripts/vendor_archify.py --check

      # The same guarantee for the Layer A cleaner, and it needs it more: that
      # tree is one Python file, so it is the one a formatter or an autofix bot
      # would happily "improve" on its way past. Reads the disk, hits no
      # network. `__pycache__` is excluded from the digest — it is a property
      # of whichever interpreter imported the module, not of the pin.
      - name: Check the vendored watermarks tree matches its pin
        run: python3 scripts/vendor_watermarks.py --check

      # `skills/bmad` is the same guarantee for the BMAD pack, and the reason
      # it is worth a second step rather than a footnote: CodeQL and ruff are
      # both told to leave that tree alone, so this is the only thing standing
      # between "vendored at 6.12.0" and whatever the tree actually holds.
      # Unlike the archify check it re-downloads the pinned npm release, so it
      # needs the network — a registry outage fails this step and nothing else.
      - name: Check the vendored BMAD tree matches its pin
        run: python3 scripts/vendor_bmad.py --check

  # TypeScript/JavaScript linting (Biome) - 15-25x faster than ESLint
  typescript:
    name: TypeScript (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # One version, read from apps/frontend/package.json: a number written
      # here as well drifted (2.5.15 locally, 2.5.11 in CI), and drift means
      # "passes locally, fails in CI". tests/test_tool_pins.py holds the
      # package.json pin to the one the rules name.
      - name: Read the Biome version
        id: biome
        run: echo "version=$(jq -r '.devDependencies["@biomejs/biome"]' apps/frontend/package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: ${{ steps.biome.outputs.version }}

      - name: Run Biome
        working-directory: apps/frontend
        # biome ci fails on errors by default; warnings are reported but don't block
        # Use --error-on-warnings when ready to enforce all rules
        run: biome ci .

  # Skills are generated: `skills/` is the source, `.agents/skills/` and the
  # harness mirrors are build output. This fails when someone edits an output
  # by hand or forgets to rebuild after editing a source.
  skills:
    name: Skills (generated output)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      # pytest-asyncio is not optional even though the eval suite is entirely
      # synchronous: tests/conftest.py declares `pytest_plugins =
      # ("pytest_asyncio",)`, so every pytest run in this repo loads it and
      # fails at collection without it.
      - name: Install the skills toolchain
        run: pip install "PyYAML>=6.0" pytest pytest-asyncio

      # Le mock de runtime BMAD est versionné (_bmad/scripts/resolve_customization.py,
      # ré-inclus par .gitignore) : il satisfait la gate [requires] du build et échoue
      # à l'appel (code 2) pour laisser aux skills leur plan B. Rien à générer ici ;
      # on vérifie seulement qu'il est bien un mock et qu'il échoue.
      - name: Check the committed BMAD mock runtime fails on invocation
        run: |
          head -3 _bmad/scripts/resolve_customization.py | grep -q workpilot-mock
          if python3 _bmad/scripts/resolve_customization.py --skill x --project-root . --key workflow; then
            echo "the mock must exit non-zero"; exit 1
          fi

      # Aligne les fichiers de build volatils directement sur la plateforme de la CI
      - name: Materialise skills on CI runner
        run: python3 scripts/skills_cli.py build

      - name: Check materialised skills are up to date
        run: python3 scripts/skills_cli.py build --check

      # The gate the learning loop has to pass. Offline: the replay uses a
      # recorded grader, so this costs no API call and cannot flake on one.
      - name: Skills evaluation harness
        run: python3 -m pytest tests/skills_eval/ -q -p no:cacheprovider

  # --------------------------------------------------------------------------
  # Gate Job - Single check for branch protection
  # --------------------------------------------------------------------------
  lint-complete:
    name: Lint Complete
    runs-on: ubuntu-latest
    needs: [python, typescript, skills]
    if: always()
    steps:
      - name: Check lint results
        run: |
          if [[ "${{ needs.python.result }}" != "success" ]] || \
             [[ "${{ needs.typescript.result }}" != "success" ]] || \
             [[ "${{ needs.skills.result }}" != "success" ]]; then
            echo "❌ Linting failed"
            echo "  Python:     ${{ needs.python.result }}"
            echo "  TypeScript: ${{ needs.typescript.result }}"
            echo "  Skills:     ${{ needs.skills.result }}"
            exit 1
          fi
          echo "✅ All linting passed"
