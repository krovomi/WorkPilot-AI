name: Skills Sync

# Watches the upstream skill packs and opens a PR when one moves.
#
# Modelled on the upstream-sync workflow this repository used to carry, with
# one deliberate difference: this never
# merges. A skill is an instruction an agent will follow on real code, so a
# change to one gets read by a person before it ships.
#
# The non-regression rule lives here: a breaking upstream change becomes a NEW
# variant, and the pinned one is left exactly as it was. A project that targets
# an older toolchain keeps resolving to the skills written for it.

on:
  schedule:
    # Monday 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      pack:
        description: 'Only check this pack (blank = all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # For the fallback below: an issue when the pull request cannot be opened.
  issues: write

concurrency:
  group: skills-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Check upstream skill packs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install "PyYAML>=6.0"

      # Classification compares the pack before and after the fetch, so the
      # "before" has to be on disk. A vendored pack commits only its pack.json,
      # which is why this runs first — without it the job can see that
      # something moved but not what, and would have to report it unclassified.
      - name: Bootstrap the vendored packs
        run: python3 scripts/skills_cli.py bootstrap || true

      - name: Compare, classify, and fork on a breaking release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_PACK: ${{ inputs.pack }}
        run: python3 scripts/skills_sync.py --apply --report "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment rather than interpolated into the
          # script: a summary containing a quote or a newline would otherwise
          # break out of the shell command.
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          set -euo pipefail
          branch="skills-sync/$(date +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add skills-lock.json skills/
          printf 'chore(skills): sync upstream packs\n\n%s\n' "$SUMMARY" > /tmp/msg
          git commit -F /tmp/msg
          git push -u origin "$branch"
          {
            printf 'Opened by the weekly skills sync.\n\n%s\n\n' "$SUMMARY"
            printf 'A release that removes a skill, narrows its targets or adds a\n'
            printf '`requires` has been forked into a new variant: the pinned cut keeps\n'
            printf 'its version and its targets, so a project on an older toolchain goes\n'
            printf 'on resolving exactly what it resolved to before.\n\n'
            printf 'Review the instruction changes, not just the diff stat: these are\n'
            printf 'prompts agents will follow on real code. A body change is reported as\n'
            printf 'potentially breaking for that reason and is not forked automatically.\n'
          } > /tmp/body
          # The repository may forbid Actions from opening pull requests
          # (Settings → Actions → General → "Allow GitHub Actions to create and
          # approve pull requests"): every run from 31 August failed there,
          # silently, with the branch pushed and nobody told. The branch is
          # still the deliverable, so say where it is, in an issue a person
          # gets notified of, and fail loudly only if that fails too.
          if ! gh pr create --base develop \
                 --title "chore(skills): sync upstream packs" \
                 --body-file /tmp/body 2> /tmp/pr-error; then
            reason="$(cat /tmp/pr-error)"
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/develop...${branch}?expand=1"
            echo "::warning::Could not open the pull request: ${reason}"
            {
              printf 'The weekly skills sync pushed `%s` but could not open its pull request:\n\n' "$branch"
              printf '```\n%s\n```\n\n' "$reason"
              printf 'Open it from %s, or allow GitHub Actions to create pull requests\n' "$compare"
              printf '(Settings → Actions → General) so the next run opens it itself.\n\n'
              cat /tmp/body
            } > /tmp/issue
            {
              printf '\n## Pull request not opened\n\n%s\n\nBranch: `%s`, compare: %s\n' "$reason" "$branch" "$compare"
            } >> "$GITHUB_STEP_SUMMARY"
            gh issue create \
              --title "Skills sync: upstream packs moved (${branch})" \
              --body-file /tmp/issue
          fi
