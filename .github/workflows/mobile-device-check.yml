name: Mobile device check

# Manual, never on a pull request. Booting an Android emulator and building an
# APK takes ten minutes and needs KVM; paying that on every PR would buy one
# signal and cost every contributor a slow queue. The fast half of the same
# question — does the code read the real toolchain honestly — runs on every PR
# already, in `tests/test_mobile_toolchain_contract.py`, on all three OS.
#
# Run this before a release, or after touching apps/backend/mobile/.
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level to boot
        required: false
        default: '34'

# A second run would fight the first for the KVM device.
concurrency:
  group: mobile-device-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android — boot, build, install, capture
    # ubuntu-latest is the only hosted image with KVM, which the emulator needs
    # to run at a usable speed. Without it the boot alone exceeds the timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        # The fixture deliberately commits no wrapper jar, so the build needs a
        # Gradle from the environment — which is also the fallback branch of
        # `_gradle_wrapper()` that no other job exercises.
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Report the toolchain before any device exists
        # The honest-absence half of the contract, on a machine that genuinely
        # has no emulator running yet.
        run: python scripts/mobile_device_check.py --project-dir tests/fixtures/android-sample

      - name: Boot an emulator, build, install, launch and capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api-level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python scripts/mobile_device_check.py \
              --project-dir tests/fixtures/android-sample \
              --platform android \
              --require-device \
              --launch

      - name: Publish the captured frame
        # Uploaded on failure too: a frame of the launcher instead of the app is
        # the single most useful artifact when the launch step goes wrong.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-device-frame
          path: device-frame.png
          if-no-files-found: warn
