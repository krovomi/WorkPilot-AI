name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            👋 Thanks for opening your first issue!

            A maintainer will triage this soon. In the meantime:
            - Make sure you've provided all the requested info
            - Join our [Discord](https://discord.gg/QhRnz9m5HE) for faster help
          pr_message: |
            🎉 Thanks for your PR!

            A maintainer will review it soon. Please make sure:
            - Your branch is synced with `develop`
            - CI checks pass
            - You've followed our [contribution guide](https://github.com/krovomi/WorkPilot-AI/blob/develop/CONTRIBUTING.md)

            Welcome to the WorkPilot-AI community!
