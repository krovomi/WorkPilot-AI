name: 'Setup Python Backend'
description: 'Set up Python with uv package manager and cached dependencies for the backend'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  install-test-deps:
    description: 'Whether to install test dependencies'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv package manager
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        # Pinned: the lockfile check in lint.yml regenerates the lock with
        # the same uv, and a resolver change must not show up as drift.
        version: "0.11.32"

    - name: Cache uv dependencies
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/uv
          ~/AppData/Local/uv/cache
          ~/Library/Caches/uv
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version }}-${{ hashFiles('apps/backend/requirements.lock', 'tests/requirements-test.txt') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version }}-

    - name: Install dependencies
      working-directory: apps/backend
      shell: bash
      run: |
        uv venv
        # The lock, not the ranges: CI tests the versions the server image
        # and contributors install, not whatever PyPI published this morning.
        # The root requirements.txt only includes this file's ranges.
        uv pip install -r requirements.lock
        if [ "${{ inputs.install-test-deps }}" == "true" ]; then
          uv pip install -r ../../tests/requirements-test.txt
        fi
