name: 'Setup Node.js Frontend'
description: 'Set up Node.js with pnpm and cached dependencies for the frontend'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  ignore-scripts:
    description: 'Whether to use --ignore-scripts flag during pnpm install'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether pnpm cache was hit'
    value: ${{ steps.cache-pnpm.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    # 1. Installer pnpm de façon autonome (évite l'utilisation cassée de npm -g)
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.27.0
        run_install: false

    # 2. Configurer Node.js en activant la gestion native du cache pnpm
    - name: Setup Node.js ${{ inputs.node-version }}
      id: cache-pnpm
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    # 3. Installer les dépendances du frontend avec pnpm
    - name: Install frontend dependencies with pnpm
      shell: bash
      run: |
        # Nettoyage préventif des anciens modules
        rm -rf apps/frontend/node_modules
        rm -rf node_modules
        
        # Installation respectant l'input de script
        cd apps/frontend
        if [ "${{ inputs.ignore-scripts }}" = "true" ]; then
          pnpm install --ignore-scripts
        else
          pnpm install
        fi

    # 4. Vérification de l'installation
    - name: Verify pnpm installation
      shell: bash
      run: |
        if [ ! -d "apps/frontend/node_modules" ]; then
          echo "::error::Frontend node_modules does not exist. pnpm install may have failed."
          exit 1
        fi
        echo "Frontend node_modules present ($(ls apps/frontend/node_modules | wc -l) entries)"

    # 5. Injection propre d'electron-vite
    - name: Install electron-vite build tool
      shell: bash
      run: |
        cd apps/frontend
        pnpm add electron-vite@5.0.0 --save-dev --ignore-scripts
