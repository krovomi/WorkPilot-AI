name: 'Setup Node.js Frontend'
description: 'Set up Node.js with npm and cached dependencies for the frontend'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  ignore-scripts:
    description: 'Whether to use --ignore-scripts flag during npm ci'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether npm cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm
      shell: bash
      # Pin pnpm to match the version that generated pnpm-lock.yaml.
      # pnpm 11 serializes the overrides section differently and triggers
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH against a lockfile written by pnpm 10.
      #
      # Installing it is not enough on its own: the macOS and Windows runner
      # images ship a pnpm of their own (a shim under ~/Library/pnpm, and
      # %LOCALAPPDATA%\pnpm) that sits ahead of npm's global bin on PATH. That
      # shim activates a version it manages itself -- 12.4.1 when this broke --
      # out of a tools directory the image does not always populate, and dies
      # with ENOEXEC. `pnpm store path` then printed nothing, actions/cache was
      # handed an empty `path`, and the job failed at setup with "Input required
      # and not supplied: path" before a single test had run. Both frontend jobs
      # went red on every branch, develop included.
      #
      # So npm's global bin goes first, and `pnpm` is the version pinned above.
      run: |
        npm cache clean --force
        npm install -g pnpm@10.27.0

        prefix="$(npm prefix -g)"
        # Unix keeps binaries in <prefix>/bin; on Windows they sit in <prefix>
        # itself. A `&&` one-liner would exit the step here under `set -e` on
        # whichever of the two lacks the directory.
        if [ -d "$prefix/bin" ]; then
          prefix="$prefix/bin"
        fi
        echo "$prefix" >> "$GITHUB_PATH"

    - name: Get pnpm cache directory
      id: pnpm-cache-dir
      shell: bash
      # Which pnpm won is the first thing to know when this breaks again.
      run: |
        pnpm --version
        if ! dir="$(pnpm store path)"; then
          echo "::error::'pnpm store path' failed; see the line above for why."
          exit 1
        fi
        if [ -z "$dir" ]; then
          echo "::error::'pnpm store path' printed nothing. Refusing to hand actions/cache an empty path, which reports itself as 'Input required and not supplied: path' three steps later."
          exit 1
        fi
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm dependencies
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-pnpm-migrate-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-migrate-

    - name: Install frontend dependencies with pnpm
      shell: bash
      # Use pnpm to install dependencies since the project uses pnpm workspaces
      # Ignore scripts to avoid electron-rebuild issues in CI
      run: |
        # Remove any existing node_modules to avoid conflicts
        rm -rf apps/frontend/node_modules
        rm -rf node_modules
        cd apps/frontend && pnpm install --ignore-scripts

    - name: Verify pnpm installation
      shell: bash
      run: |
        if [ ! -d "apps/frontend/node_modules" ]; then
          echo "::error::Frontend node_modules does not exist. pnpm install may have failed."
          exit 1
        fi
        echo "Frontend node_modules present ($(ls apps/frontend/node_modules | wc -l) entries)"

    - name: Install electron-vite build tool
      shell: bash
      # electron-vite bin link is not reliably created by npm ci for workspace devDependencies.
      # Install it explicitly at root so node_modules/.bin/electron-vite is always present.
      run: cd apps/frontend && pnpm add electron-vite@5.0.0 --save-dev --ignore-scripts
