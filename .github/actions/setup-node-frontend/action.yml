name: 'Setup Node.js Frontend'
description: 'Set up Node.js with pnpm and cached dependencies for the frontend'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  ignore-scripts:
    description: 'Whether to use --ignore-scripts flag during pnpm install'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether pnpm cache was hit'
    value: ${{ steps.cache-pnpm.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    # 1. Détection automatique de la version de pnpm depuis le package.json (évite les conflits)
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    # 2. Configuration de Node.js et activation du cache pnpm natif
    - name: Setup Node.js ${{ inputs.node-version }}
      id: cache-pnpm
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    # 3. Nettoyage et installation des dépendances du frontend
    - name: Install frontend dependencies with pnpm
      shell: bash
      run: |
        # Suppression des anciens dossiers pour éviter les conflits de shims/binaires
        rm -rf apps/frontend/node_modules
        rm -rf node_modules
        
        cd apps/frontend
        if [ "${{ inputs.ignore-scripts }}" = "true" ]; then
          pnpm install --ignore-scripts
        else
          pnpm install
        fi

    # 4. Vérification de la bonne création du dossier node_modules
    - name: Verify pnpm installation
      shell: bash
      run: |
        if [ ! -d "apps/frontend/node_modules" ]; then
          echo "::error::Frontend node_modules does not exist. pnpm install may have failed."
          exit 1
        fi
        echo "Frontend node_modules present ($(ls apps/frontend/node_modules | wc -l) entries)"

    # 5. Installation isolée de l'outil de build electron-vite
    - name: Install electron-vite build tool
      shell: bash
      run: |
        cd apps/frontend
        pnpm add electron-vite@5.0.0 --save-dev --ignore-scripts
