description = "Avant de corriger un bug, le faire apparaître — un test qui échoue pour la raison décrite, ou la commande qui montre le défaut — et écrire ce que la reproduction prouve, la cause probable avec ses preuves `fichier:ligne`, et le périmètre du correctif. Rien d'autre n'est modifié. Le rapport est remis au planner, puis au coder."
prompt = """
# reproduce — faire apparaître le bug avant d'y toucher

Un correctif écrit sans reproduction corrige ce que la description dit, pas
forcément ce qui se passe. Cette phase produit la preuve : un test qui échoue
**pour la raison décrite**, ou à défaut la commande dont la sortie montre le
défaut. Le test écrit ici devient vert quand le bug est corrigé, et reste dans
le dépôt comme test de régression.

Personne ne répond aux questions pendant cette phase. Ce que les entrées ne
permettent pas de trancher devient une hypothèse écrite, pas une question.

## Entrées

| Fichier | Ce qu'on y cherche |
|---|---|
| `<spec_dir>/spec.md` | le comportement attendu, le comportement observé, les critères |
| `<spec_dir>/requirements.json` | la demande telle qu'elle a été tapée : messages d'erreur, étapes |
| `<spec_dir>/context.json` | les fichiers que le pipeline de spec a jugés pertinents |
| le code du projet | le chemin d'exécution qui mène au symptôme ; les tests voisins |
| les traces jointes (sous `docintel`, plus haut dans ce prompt) | la pile d'appels, la ligne qui lève |

## Méthode

1. **Reformule le bug** en une phrase : *quand* (l'action), *quoi* (ce qui se
   passe), *au lieu de* (ce qui devrait).
2. **Trouve le chemin** du symptôme dans le code : la fonction qui produit la
   sortie fautive, puis ce qui l'appelle. Cite chaque étape en `fichier:ligne`.
3. **Écris le test** dans le dossier de tests du projet, avec sa bibliothèque
   habituelle, nommé d'après le bug (`test_<symptome>` ou l'équivalent du
   langage). Il doit :
   - échouer **maintenant**, avec un message qui montre le défaut, pas une
     erreur d'import ou de fixture ;
   - devenir vert quand le comportement attendu est en place, sans
     modification du test.
   Lance-le. Colle sa sortie dans le rapport.
4. **Si aucun test n'est possible** (le bug tient à un environnement, à un
   service externe, à une interface) : la commande, ou la suite d'étapes, qui
   montre le défaut, et sa sortie. Dis pourquoi un test ne l'attrape pas.
5. **Désigne la cause probable** : la ligne, la condition, la donnée. Une cause
   est *probable* tant que le correctif ne l'a pas confirmée ; dis quel indice
   la soutient et ce qui pourrait la contredire.
6. **Borne le correctif** : les fichiers à toucher, ceux à ne pas toucher, les
   comportements voisins qui doivent rester identiques. Un bug ne justifie pas
   une refonte.

À effort `low`, les étapes 1 à 3 suffisent ; à `high` et au-delà, cherche
aussi les autres entrées du même chemin qui produiraient le même symptôme.

## Rapport

Termine par ceci, et rien d'autre :

```markdown
## Bug

Quand … , … au lieu de … .

## Reproduction

Test : `chemin/du/test` — échoue : <extrait de la sortie>
(ou) Commande : `…` — sortie : <extrait>

## Cause probable

`fichier:ligne` — … Indices : … Contre-indices : …

## Périmètre du correctif

À toucher : `…`
À ne pas toucher : `…`
Doit rester identique : …

## Hypothèses

- [NEEDS CLARIFICATION: …]
```

## Ce que cette phase ne fait pas

- **Elle ne corrige pas.** Le seul fichier ajouté est le test ; le code de
  production n'est pas modifié, même d'une ligne « évidente ».
- **Elle n'affaiblit rien** : pas de test existant modifié, ignoré ou
  marqué à sauter pour que la suite passe.
- **Elle ne devine pas** : un test qui échoue pour une autre raison que le
  bug n'est pas une reproduction, c'est un second problème — à signaler dans
  les hypothèses.
"""
