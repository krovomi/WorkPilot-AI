packages:
  - apps/*
  - libs/*

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - node-pty

overrides:
  '@babel/core': ^7.29.6
  # Radix keeps the "which layer owns the focus trap" stack in a module-level
  # singleton. Two copies of that module means two stacks, so neither pauses
  # the other: a Select opened inside a Dialog gives both scopes an active
  # trap, each answers the other's focusout by focusing back, and the pair
  # recurses until the stack is exhausted. Dependabot moved react-select and
  # react-dropdown-menu on to focus-scope 1.1.16 while react-dialog,
  # react-popover, react-toast and react-tooltip stayed on 1.1.7, which is
  # exactly that split. Deduping restores the single stack the design assumes.
  '@radix-ui/react-focus-scope': 1.1.16
  '@radix-ui/react-dismissable-layer': 1.1.19
  '@radix-ui/react-focus-guards': 1.1.6
  '@electron/rebuild': 4.0.3
  '@hono/node-server': '>= 1.19.15'
  '@opentelemetry/core': '>= 2.8.0'
  '@xmldom/xmldom': ^0.8.12
  ajv: ^8.18.0
  app-builder-lib: ^26.15.3
  brace-expansion: '>= 5.0.9'
  builder-util-runtime: '>= 9.7.0'
  dmg-builder: ^26.15.3
  dompurify: '>= 3.4.6'
  electron-builder-squirrel-windows: ^26.15.3
  esbuild: '>= 0.28.1'
  fast-uri: ^3.1.5
  form-data: '>= 4.0.6'
  hono: '>= 4.12.27'
  ip-address: '>= 10.3.1'
  js-yaml: ^4.3.1
  lodash: '>= 4.18.0'
  nanoid: ^3.3.18
  picomatch: '>= 4.0.4'
  postcss: '>= 8.5.18'
  rollup: '>= 4.59.0'
  shell-quote: '>= 1.8.4'
  tar: '>= 7.5.19'
  tmp: '>= 0.2.6'
  undici: ^7.29.0
  vite: '>= 8.0.16'
  yaml: '>= 2.8.3'
