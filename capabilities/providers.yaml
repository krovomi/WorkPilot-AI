# ---------------------------------------------------------------------------
# Coding-agent CLIs driven as subprocesses (core/agent_clients/cli_subprocess.py).
# They bring their own tools, sessions and login; WorkPilot hands the prompt
# on stdin and reads JSON events back, as with the Codex CLI.
# ---------------------------------------------------------------------------

opencode:
  adapter: OpenCodeCliAgentClient
  subagents: none
  effort: none
  degrades_to: null
  context:
    compact: emulated
    usage: reported
  note: >-
    `opencode run --format json`. A type declaring none of Write/Edit/Bash runs
    the built-in `plan` agent. OpenCode also compacts a session on its own when
    the window fills (compaction.auto, on by default), but `run` has no command
    to compact on demand, hence `emulated`. step_finish events report tokens.
  sandbox:
    state:
      - ~/.local/share/opencode
      - ~/.config/opencode
      - ~/.cache/opencode
      - ~/.local/state/opencode
    network: &llm_hosts
      - api.anthropic.com
      - console.anthropic.com
      - api.openai.com
      - auth.openai.com
      - generativelanguage.googleapis.com
      - oauth2.googleapis.com
      - openrouter.ai
      - api.mistral.ai
      - api.deepseek.com
      - api.x.ai
      - api.groq.com
      - api.cerebras.ai
      - api.together.xyz
      - api.fireworks.ai
      - api.github.com
      - api.githubcopilot.com
      - models.dev
      - models.opencode.ai
      - opencode.ai
      - 127.0.0.1:11434
      - 127.0.0.1:1234
      - 127.0.0.1:8080

antigravity:
  adapter: AntigravityCliAgentClient
  subagents: none
  effort: reasoning_effort
  degrades_to: null
  context:
    compact: emulated
    usage: reported
  note: >-
    Google Antigravity CLI (`agy`) in stream-json print mode; --effort
    low|medium|high. It cannot be restricted to read-only, so a type declaring
    none of Write/Edit/Bash is refused. `/compact` exists interactively but is
    not documented in print mode. Alias: agy.

pi:
  adapter: PiCliAgentClient
  subagents: none
  effort: reasoning_effort
  degrades_to: null
  context:
    compact: emulated
    usage: reported
  note: >-
    `pi --mode json` (pi.dev) with the prompt on stdin. Rights are an
    allowlist: the agent type's declaration, translated through
    capabilities/harnesses.yaml `pi.tools` and pi's MCP names, becomes
    `--tools`; a type declaring none of Write/Edit/Bash runs with
    `read,grep,find,ls` and a write call is answered "Tool write not found"
    (tests/fixtures/pi/readonly-write-refused.jsonl). Sessions live in the
    task's spec directory (PI_CODING_AGENT_SESSION_DIR) and are resumed by id.
    The project's skills reach pi explicitly (`--skill .agents/skills`); its
    `.pi/` resources load only once a person trusted the checkout in pi, and
    the adapter reports that state in the task feed rather than approving.
    `--thinking` takes the phase's effort level. pi compacts on its own when
    the window fills, and json mode has no compact-on-demand, hence
    `emulated`; with WORKPILOT_PI_MODE=rpc the client reports itself as
    `pi-rpc` and context_mgmt/capabilities.py declares it native, as for
    Codex. The usage of every assistant message is reported. A write guard
    (core/agent_clients/pi_guard/) runs inside pi with path_guard's policy.
    Design: docs/architecture/pi.md.
  sandbox:
    state:
      - ~/.pi
      - $PI_CODING_AGENT_DIR
    read_only:
      - ~/.pi/agent/trust.json
      - $PI_CODING_AGENT_DIR/trust.json
    network: *llm_hosts

# ---------------------------------------------------------------------------
# Agent Client Protocol agents (agentclientprotocol.com): one entry per agent,
# all driven by AcpAgentClient over JSON-RPC on the agent's stdio. The `acp:`
# block says how to start the agent and which of its modes keep a person in
# the loop; what the agent can do (session/load, MCP transports, usage) is
# what it declares in `initialize`, read at run time and never assumed here.
#   command             executable and arguments; no shell, no path
#   model_flag          the option that names the model, when it has one
#   model_prefixes      model ids it takes; any other id runs its default
#   approval_mode       the mode in which it asks before acting
#   read_only_mode      the mode in which it cannot change anything, for a
#                       type that declares none of Write/Edit/Bash
#   auto_approve_modes  modes that act without asking: never kept
#   auth_env            login method → the variable that makes it usable,
#                       tried only when the agent says a login is required
# Design: docs/architecture/acp.md.
# ---------------------------------------------------------------------------

gemini-cli:
  adapter: AcpAgentClient
  subagents: none
  effort: none
  degrades_to: null
  context:
    compact: emulated
    usage: exact
  acp:
    label: Gemini CLI
    command: [gemini, --acp]
    model_flag: --model
    model_prefixes: [gemini-]
    approval_mode: default
    read_only_mode: plan
    auto_approve_modes: [autoEdit, yolo]
    auth_env:
      gemini-api-key: GEMINI_API_KEY
    login: Run `gemini` once in a terminal and sign in, or set GEMINI_API_KEY.
    docs: https://geminicli.com/docs/cli/acp-mode/
  note: >-
    `gemini --acp` (Gemini CLI ≥ 0.65, fixtures in tests/fixtures/acp/gemini-cli).
    A permission request becomes a question on the task card; an action
    outside the agent type's declared tools is refused without asking, and a
    type that declares none of Write/Edit/Bash runs in Gemini's `plan` mode,
    where write_file and run_shell_command do not run. Writes inside the
    worktree come back to WorkPilot (fs/write_text_file) and pass the same
    write-root and protected-file checks as the SDK hook. Gemini lets a
    command it reads as harmless (`echo`) run without asking: a type that
    does not declare Bash and sees one run has its turn stopped. Sessions are
    resumed with session/load when Gemini declares it. usage_update reports
    the window fill. Gemini compacts on its own; ACP has no compact request.

# ---------------------------------------------------------------------------
# No agentic adapter yet. Selecting one of these runs the task on the Claude
# SDK. That is a real limitation, not a configuration detail, so it is stated
# here and traced into the task feed at run time.
# ---------------------------------------------------------------------------

meta:
  adapter: null
  subagents: none
  effort: none
  degrades_to: claude
  context:
    compact: native
    usage: exact

aws:
  adapter: null
  subagents: none
  effort: thinking_budget
  degrades_to: claude
  context:
    compact: native
    usage: exact
  note: Bedrock-hosted Anthropic models; the degradation is closer than it looks.

cursor:
  adapter: null
  subagents: none
  effort: none
  degrades_to: claude
  context:
    compact: native
    usage: exact

custom:
  adapter: null
  subagents: none
  effort: none
  degrades_to: claude
  context:
    compact: native
    usage: exact
  note: >-
    An Anthropic-compatible gateway configured through ANTHROPIC_BASE_URL. The
    degradation is intentional here: routing through the Claude SDK is exactly
    what a custom gateway is for.
