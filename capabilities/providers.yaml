# What each LLM provider can actually do when driving an agentic task.
#
# The point of this file is that WorkPilot advertises itself as
# provider-agnostic, and "agnostic" has to mean *honest about the differences*
# rather than pretending there are none. Before it existed, picking Mistral,
# DeepSeek, Grok, Meta or AWS silently ran the task on Claude: the `else`
# branch of create_agent_client() logged a warning nobody reads and called
# create_client(), which has no provider parameter at all.
#
# Fields:
#   adapter     the client class that drives this provider agentically.
#               `null` means there is none — see `degrades_to`.
#   subagents   native   the provider runs real subagents in their own context
#                        (the Claude Agent SDK: `agents=` and its Agent tool)
#               emulated WorkPilot runs them: the roster is offered to the model
#                        as the `delegate` tool, and each delegation is a child
#                        session of the same client with the specialist's tools
#                        (harness/application/delegation.py). Every provider
#                        driven by the WorkPilot loop is in this state.
#               none     it cannot; the workflow runs phases sequentially with
#                        a context reset instead of dispatching in parallel.
#                        The CLIs (Codex, OpenCode, Antigravity) bring their
#                        own tools and take no roster at run time; the registry
#                        reaches them as files (`.codex/agents/`, …).
#   effort      how reasoning depth is expressed, so phase_config can map onto it.
#               What each level becomes per model is core/effort_plan.py, served
#               to the picker by GET /providers/effort.
#   degrades_to what actually runs when `adapter` is null. Surfaced in the task
#               feed, never silent.
#   context     how a session's context window is managed (context_mgmt/):
#                 compact  native    the provider summarises its own history
#                                    (Claude `/compact`, Codex auto-compaction)
#                          emulated  WorkPilot summarises the conversation log
#                                    and the next session replays the summary
#                 usage    exact     the provider reports the window fill
#                          reported  per-turn prompt tokens are reported
#                          estimated only characters can be counted
#               "clear" (a fresh thread seeded with a handoff) works everywhere.
#   sandbox     a CLI that runs its own commands is started whole inside the OS
#               sandbox (os_sandbox/, docs/architecture/os-sandbox.md):
#                 state    its login and session directories (~/… or $VAR/…),
#                          left writable; created when missing
#                 network  the hosts it talks to, added to the package
#                          registries; `*.example.com` is a subdomain of it,
#                          `127.0.0.1:port` a local endpoint
#                 read_only files under `state` the agent may not change
#                          (pi's trust.json), when they exist
#               A CLI without this block is not sandboxed, and its card says so.
#
# Adding a real adapter for a provider is a strictly better outcome than
# listing it here with `adapter: null`. This file records the current truth,
# not the desired one.

claude:
  adapter: ClaudeAgentClient
  subagents: native
  effort: thinking_budget
  degrades_to: null
  context:
    compact: native
    usage: exact

copilot:
  adapter: CopilotAgentClient
  subagents: emulated
  effort: thinking_budget
  degrades_to: null
  context:
    compact: emulated
    usage: reported
  note: Was declared native while nothing reached the model; see `emulated`.

windsurf:
  adapter: WindsurfAgentClient
  subagents: emulated
  effort: none
  degrades_to: null
  context:
    compact: emulated
    usage: reported
  note: >-
    Dual-mode (gRPC to the local IDE language server, or REST with
    OpenAI-compatible function calling). Sub-agents are emulated in both: a
    child session of this client per delegation.

openai:
  adapter: OpenAIAgentClient
  subagents: emulated
  effort: reasoning_effort
  degrades_to: null
  context:
    compact: emulated
    usage: reported
  note: >-
    With OPENAI_AUTH_MODE=codex-cli the task runs on CodexCliAgentClient, whose
    threads compact natively (model_auto_compact_token_limit); context_mgmt
    resolves that from the client, not from this entry.

google:
  adapter: GoogleAgentClient
  subagents: emulated
  effort: reasoning_effort
  degrades_to: null
  context:
    compact: emulated
    usage: reported

ollama:
  adapter: LocalAgentClient
  subagents: emulated
  effort: think
  degrades_to: null
  context:
    compact: emulated
    usage: reported
local:
  adapter: LocalAgentClient
  subagents: emulated
  effort: think
  degrades_to: null
  context:
    compact: emulated
    usage: reported
lmstudio:
  adapter: LocalAgentClient
  subagents: emulated
  effort: none
  degrades_to: null
  context:
    compact: emulated
    usage: reported

