name: feature-build
description: >-
  The default build pipeline. Replaces the sequence hard-coded in
  cli/build_commands.py, and is what arbitrates between the methodology packs:
  each phase names an implementation, so a methodology is an interchangeable
  part rather than a competing pipeline. Every implementation named here
  resolves on a fresh clone (`validate_impls` is empty at every effort): a
  phase whose skill is not on disk is printed in the profile and run by
  nobody, which is the one thing this file must never describe.

# Phase ids reuse the vocabulary phase_config already knows (spec, planning,
# coding, qa), so per-phase model and effort resolution keeps working unchanged.
phases:
  - id: docs
    impl: workpilot/libdocs
    always: true
    description: >-
      Downloads the current documentation of every library this task needs and
      the repository shows no example of. Costs no API call — manifests and
      import counts decide, not a model — so there is no effort level at which
      skipping it saves anything. First, because every phase after it reasons
      about those APIs.

  - id: brainstorm
    impl: tooling/brainstorm-approaches
    min_effort: high
    description: >-
      Two or three ways of doing the task, side by side — files, precedent in
      the code, risks, conformance to the project's rules — and one
      recommended, before the planner commits to the first plan that comes to
      mind. Non-interactive: what the inputs cannot settle is written down as
      `[NEEDS CLARIFICATION]`. The report is handed to the planner
      (`workflows.handoff`), which is the only reason it is worth a session.

      There is no `spec` phase: the spec pipeline has written `spec.md` before
      this file is read. The BMAD PRD skill it used to run needs the `_bmad/`
      runtime, so it never opened a session — and would have written a second
      product document nobody reads.

  - id: planning
    impl: workpilot/planner
    gate: human
    description: >-
      The existing planner. Human approval before implementation starts is a
      deliberate stop, not a formality. Never pruned by effort: a build cannot
      code without a plan, so the coder loop plans whatever the profile says —
      and a profile that announced planning as skipped at effort `none` was
      describing a build that does not exist.

  - id: analyze
    impl: tooling/spec-analyze
    min_effort: medium
    dispatch: fresh-context
    roster: planner
    description: >-
      Read `spec.md` and `implementation_plan.json` together, once, before any
      code is written. `traceability.json` has already answered the mechanical
      half — which requirement no subtask claims — so this pass spends its
      budget on what a parser cannot see: the two documents contradicting each
      other, a plan that violates the project's own conventions, an acceptance
      criterion nothing can verify. The gap costs a sentence here and a fix
      cycle after QA. Fresh context because the reader must not be the planner.

      `roster: planner` because the specialists this needs are the planner's:
      `architecture-analyst` is the one that answers "does this plan break the
      project's own conventions", and `dependency-tracer` answers what a
      subtask's blast radius really is. It ran under the read-only
      `spec_validation` config with no roster mapping, so it fell through to
      the Kanban default and was handed a `test-runner` — before a line of
      code exists. The roster is context billed on every turn.

  - id: ui-design-system
    impl: ui-ux-pro-max/ui-ux-pro-max
    when: &ui_surface touches("**/*.tsx,**/*.jsx,**/*.vue,**/*.svelte,**/*.astro,**/*.html,**/*.css,**/*.scss,**/*.sass,**/*.less,**/*.razor,**/*.cshtml,**/*.xaml,**/*.axaml,**/*.swift,**/*.dart,**/*.fxml,**/res/layout/**,**/res/values/**")
    description: >-
      Interfaces seulement, et sans modèle : le moteur local de ui-ux-pro-max
      (BM25 en Python standard, sans réseau) fixe le design system de la tâche
      avant que le code n'existe. Le `design-system/<projet>/MASTER.md` du
      projet fait foi quand il existe ; sinon un design system est généré et
      écrit dans le worktree — il arrive dans le diff, une personne le relit,
      et la tâche UI suivante le relit au lieu d'en inventer un autre.

      Les règles du stack touché (React, Next.js, WPF, WinUI, Avalonia,
      SwiftUI, Compose, Flutter…) s'y ajoutent. Le coder ne les reçoit que sur
      les sous-tâches dont les fichiers sont UI ; la QA juge contre le même
      design system, et `design-check` note le code une fois écrit. Déterministe et gratuit : jamais
      élagué par l'effort. La liste de fichiers est `UI_GLOBS` de
      `apps/backend/uiux/surface.py` : `scripts/sync_surface_globs.py` réécrit
      cette ligne depuis Python, et `tests/test_uiux.py` échoue si elles
      divergent.

  - id: mobile-design
    impl: mobile/mobile-design-review
    min_effort: medium
    when: &mobile_surface touches("**/AndroidManifest.xml,**/*.gradle.kts,**/*.gradle,**/*.kt,**/*.swift,**/Info.plist,**/*.xcodeproj/**,**/*.xcworkspace/**,**/pubspec.yaml,**/*.dart,**/*.xaml,**/capacitor.config.*,**/PrivacyInfo.xcprivacy,**/*.entitlements")
    dispatch: fresh-context
    description: >-
      Applications smartphone uniquement. Ce qu'`impeccable` vérifie sur le web
      n'a pas d'équivalent ici : profondeur de pile de navigation, cibles
      tactiles, les quatre états d'un écran, le comportement hors-ligne, les
      libellés que TalkBack et VoiceOver sont seuls à lire. Avant le codage,
      parce qu'un écran mal découpé se corrige en une phrase à ce moment-là et
      en un cycle complet après la QA.

  - id: coding
    impl: tooling/tdd-cycle
    dispatch: subagent-per-task
    description: >-
      Red-green-refactor. Degrades to sequential execution with a context reset
      on providers that cannot run subagents. The skill is the methodology and
      the coder loop is the executor: the engine names the skill file in the
      prompt rather than pasting it into every subtask session.

  - id: design-check
    impl: impeccable/impeccable
    when: &frontend_surface touches("**/*.tsx,**/*.jsx,**/*.css,**/*.scss,**/*.vue,**/*.svelte,**/*.astro,**/*.html,**/*.less,**/*.sass,**/*.razor,**/*.cshtml")
    description: >-
      Frontend only, and narrower than `&ui_surface` on purpose: impeccable's
      detectors read HTML, CSS and JSX-like markup, so XAML/AXAML, SwiftUI,
      Flutter, FXML and Android `res/` — interfaces `ui-design-system` does
      cover — would open the gate on files it has no rule for.
      `tests/test_uiux.py` holds this list to a subset of `UI_GLOBS`.

      impeccable's 59 detector rules run locally with no API
      call, so this is never pruned by effort — skipping it would save nothing.
      The implementation is the pack's `gate` command (`skills/impeccable/
      pack.json`), not a skill: nothing has to be bootstrapped for it to run.

      What to aim for before coding is `ui-design-system`'s answer, which is
      deterministic and free. A `frontend-design` session used to sit before
      `coding` as well; its skill was never on disk, so it never opened, and
      what it would have written was read by nobody.

  - id: review
    impl: tooling/review-lenses
    min_effort: medium
    dispatch: fresh-context
    description: >-
      A reviewer that did not write the code, before QA, with lenses the
      effort chooses: correctness and tests and security at medium; conformance
      to the acceptance criteria and `traceability.json` from high; the
      adversarial reading at ultrathink. The report is handed to the QA
      reviewer (`workflows.handoff`), which decides. At low effort the coding
      phase's own self-review is what there is.

      One review instead of three: `adversarial-review` and `spec-conformance`
      used to run after QA, where no fixer reads anything, on BMAD skills that
      need the `_bmad/` runtime and so never opened a session. Their questions
      are lenses here, asked while an answer can still change the build.

  - id: verify
    impl: tooling/verify
    agent: verifier
    roster: qa
    dispatch: fresh-context
    hard_gate: tests-pass,app-verified
    description: >-
      La boucle de vérification : lancer l'application que la tâche a
      modifiée, constater qu'aucune erreur n'apparaît, corriger et relancer
      tant que le nombre d'erreurs baisse, amener l'app jusqu'à l'état
      modifié (clics, ou appels des endpoints créés/modifiés avec leurs
      payloads) et le confirmer, tracer la performance via Chrome DevTools
      MCP, garder captures et score comme preuve. Frontend web/desktop,
      application mobile (émulateur Android / simulateur iOS), API.

      Jamais élaguée : « ça avait l'air bien » n'est pas une preuve, quel que
      soit le budget. À effort `low`, seule la partie déterministe tourne
      (lancement, erreurs, correctifs bornés, trace, captures, endpoints
      appelés depuis le schéma) ; à partir de `medium`, une session
      `verifier` pilote l'app jusqu'au changement. Placée avant la QA pour
      que la revue juge un code déjà vu tournant, preuve en main.

      Exécutée par `verify.loop` (`CUSTOM_EXECUTORS`), pas par une session
      unique : ce qui est déterministe est identique pour chaque
      fournisseur, et le skill est spécialisé par ses surcharges
      `providers/*.md`. `tests-pass` reste lu dans le rapport de QA.

  - id: qa
    impl: workpilot/qa-loop
    always: true
    description: >-
      The existing QA reviewer/fixer loop. A reasoning effort of none reduces
      model thinking, not validation: completed coding still requires QA.

  - id: store-readiness
    impl: mobile/mobile-store-readiness
    min_effort: medium
    when: *mobile_surface
    dispatch: fresh-context
    description: >-
      Ce sur quoi le Play Store et l'App Store rejettent, et qu'aucun test du
      dépôt n'attrape : une permission déclarée jamais demandée, une chaîne
      d'usage manquante dans Info.plist, un artefact signé avec la clé de debug,
      une déclaration de confidentialité en retard sur ce que le code envoie.
      Un rejet coûte des jours ; le même constat posé ici coûte une ligne. En
      lecture seule — le correctif appartient à la phase de codage.

  - id: architecture-map
    impl: tooling/architecture-map
    min_effort: medium
    when: touches("**/*.py,**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.mjs,**/*.go,**/*.rs,**/*.java,**/*.cs,**/*.kt,**/*.rb,**/*.php,**/*.swift,**/Dockerfile,**/docker-compose*.yml,**/docker-compose*.yaml,**/*.tf,**/*.csproj,**/pyproject.toml,**/package.json,**/go.mod,**/pom.xml")
    dispatch: fresh-context
    description: >-
      Ce que la tâche a changé dans la topologie du système, et pas seulement
      dans ses fichiers. Un diff dit quelles lignes ont bougé ; il ne dit pas
      qu'un composant est apparu, qu'une frontière de confiance s'est déplacée,
      ou qu'un service parle maintenant directement à une base qu'il atteignait
      par une file.

      Après la QA, parce que la carte doit décrire le code corrigé et non celui
      qui a été écrit. En contexte frais : le modèle « après » part du modèle de
      référence et doit en conserver les identifiants — le comparateur apparie
      les composants par `id`, et un modèle écrit de zéro ressort en tout
      supprimé et tout ajouté.

      Deux filtres, et il en faut deux. Le glob ci-dessus écarte gratuitement
      les tâches purement documentaires. Mais « a touché un .ts » ne veut pas
      dire « a changé l'architecture », alors une passe déterministe
      (`architecture_visualizer.archify.significance`) tranche à l'intérieur de
      la phase, avant tout appel API : les fichiers modifiés recoupent-ils les
      sources d'un composant modélisé, ou dessinent-ils une zone que le modèle
      ne décrit pas encore ? Sous le seuil, la phase écrit « aucun changement
      architectural » et rend la main pour zéro jeton — comme `docs` avec sa
      préflight.

  - id: verify-replay
    impl: tooling/verify
    description: >-
      La vérification rejouée sans modèle après la QA : mêmes cibles
      relancées, même scénario rejoué (chaque clic vise l'élément décrit,
      pas son uid), mêmes appels d'endpoints, état confirmé recherché sur la
      page. Ignorée quand l'arbre de travail n'a pas changé depuis la
      vérification. Un échec passe le rapport à `fail` (« régression après
      la QA ») : le gate `app-verified` et le badge du Kanban le lisent.
      Zéro jeton, donc jamais élaguée.

  - id: observe
    impl: workpilot/observe
    always: true
    description: >-
      Watches for corrections the user made, work no skill covered, and its own
      blind spots. Writes candidates to skills/_proposed/ and never edits a
      skill directly. Near-free, so it runs at every effort level. Run by
      `learning_loop/observe.py` — WorkPilot's own, hence `workpilot/`: the
      `task-observer` skill this named was never read by it.

      This is also where the hermes-agent cycle turns (`hermes.loop`, surface
      `build`): what hermes authored from its own experience — on Telegram, on
      a cron job, in a terminal WorkPilot never saw — is filed in the same
      review queue, carrying no external signal and promoted by nothing. It
      stays inside this phase rather than declaring one of its own because the
      question it answers is this phase's question, and because a phase
      declared where no window opens is resolved, printed, and run by nobody.
      When hermes is not installed, the cycle reports that and costs nothing.
