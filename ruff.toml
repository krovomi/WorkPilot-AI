# Ruff configuration for WorkPilot AI

# Vendored third-party trees. BMAD ships Python beside its skills, and
# `scripts/vendor_bmad.py --check` re-downloads the pinned release and compares
# it byte for byte — so anything the formatter "improves" here is reported as
# drift on the next check, on every machine. These files are evidence of what
# upstream published, not code this repository maintains.
extend-exclude = [
    "skills/bmad",
    "apps/backend/vendor",
]

[lint]
# Enable common rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B904",   # raise from err (too many to fix now)
    "B905",   # zip without strict parameter
    "C401",   # unnecessary generator
    "C416",   # unnecessary list comprehension
    "E402",   # module level import not at top of file
    "W293",   # blank line contains whitespace
    "B007",   # loop control variable not used
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/*" = ["B011", "F811"]  # assert false in tests, fixture redefinitions are normal
"test_*.py" = ["F401"]    # unused imports in test files (for availability checks)

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
